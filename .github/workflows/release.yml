name: Release Firefox extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Check tag matches both extension versions
        run: node scripts/check-release-version.cjs "$RELEASE_TAG"

      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate extension
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install browser for layout tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:ui

      - name: Build extension ZIP
        run: npm run build

      - name: Generate checksum
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Album Grid for Suno $RELEASE_TAG" \
            --notes-file docs/GITHUB-RELEASE.md